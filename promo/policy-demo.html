<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spending policy demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=block">
<style>
/* Staged recording against a LOCAL test chain: the real app (app.html in an iframe) and real transactions
   from the agent key, with a mock token. Set up with contracts/scripts/demo-policy.js.
   window.step(t) moves the recording forward; it only goes forward. */
:root{--bg:#0d0d0d;--ink:#ece9e2;--sub:#b9b5ad;--lab:#7f7b74;--dim:#4c4945;--ok:#9bc59d;--err:#e08a7a;--line:rgba(236,233,226,.12);--line2:rgba(236,233,226,.24);
  --SERIF:'Instrument Serif',serif;--SANS:'Inter',sans-serif;--MONO:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--SANS);-webkit-font-smoothing:antialiased}
#grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.35;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 45%,#000,transparent 80%)}
.top{position:absolute;left:60px;right:60px;top:36px;display:flex;justify-content:space-between;align-items:baseline}
.top .word{font:400 30px/1 var(--SERIF);letter-spacing:.3em;text-transform:uppercase}
.top .lab{font:400 15px/1 var(--MONO);letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
#win{position:absolute;left:60px;top:100px;width:1160px;height:800px;border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:#0d0d0d;box-shadow:0 40px 120px rgba(0,0,0,.7)}
#bar{height:44px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#141413;border-bottom:1px solid var(--line)}
#bar .dots{display:flex;gap:7px}#bar .dots i{width:11px;height:11px;border-radius:50%;background:#2d2c2a}
#bar .addr{flex:1;max-width:560px;margin:0 auto;height:26px;display:flex;align-items:center;padding:0 14px;background:#1b1b19;border-radius:7px;font:400 13px/1 var(--MONO);color:var(--sub)}
iframe{position:absolute;left:0;top:44px;width:1160px;height:756px;border:0;background:#0d0d0d}
#term{position:absolute;left:1250px;top:100px;width:610px;height:800px;border:1px solid var(--line2);border-radius:14px;background:#0a0a0a;overflow:hidden;display:flex;flex-direction:column}
#term .hd{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);font:400 13px/1 var(--MONO);letter-spacing:.14em;text-transform:uppercase;color:var(--lab)}
#term .hd b{color:var(--ink);font-weight:400}
#lines{flex:1;padding:18px 20px;font:400 17px/1.55 var(--MONO);color:var(--sub);overflow:hidden}
.ln{margin-bottom:16px;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
.ln.on{opacity:1;transform:none}
.ln .cmd{color:var(--ink)}
.ln .cmd i{color:var(--dim);font-style:normal}
.ln .res{margin-top:4px;padding-left:18px}
.ln .ok{color:var(--ok)}.ln .err{color:var(--err)}.ln .wait{color:var(--dim)}
.ln .why{display:block;color:var(--lab);font-size:15px}
#cap{position:absolute;left:60px;right:60px;bottom:58px;font:400 44px/1 var(--SERIF);letter-spacing:-.01em;opacity:0}
#cap b{font:400 16px/1 var(--MONO);letter-spacing:.16em;color:var(--lab);margin-right:22px;vertical-align:middle}
#tag{position:absolute;right:60px;bottom:66px;font:400 14px/1 var(--MONO);letter-spacing:.14em;color:var(--lab);text-transform:uppercase}
#cursor{position:absolute;left:0;top:0;width:28px;height:28px;opacity:0;pointer-events:none;z-index:20}
#ripple{position:absolute;width:54px;height:54px;margin:-27px 0 0 -27px;border:2px solid var(--ink);border-radius:50%;opacity:0;z-index:19}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);opacity:0;z-index:30}
#end .l{font:400 18px/1 var(--MONO);letter-spacing:.18em;text-transform:uppercase;color:var(--sub)}
#end h2{margin-top:34px;font:400 104px/.95 var(--SERIF);letter-spacing:-.02em;text-align:center}
#end h2 em{font-style:italic;color:var(--sub)}
#end p{margin-top:36px;font:400 20px/1 var(--MONO);letter-spacing:.12em;color:var(--lab);text-transform:uppercase}
#fade{position:absolute;inset:0;background:var(--bg);z-index:40}
</style>
</head>
<body>
<div id="grid"></div>
<div class="top"><span class="word">Charter</span><span class="lab">Spending policies for AI agents</span></div>
<div id="win"><div id="bar"><div class="dots"><i></i><i></i><i></i></div><div class="addr">charterai.world / app / policies / agent 8843</div></div><iframe id="app"></iframe></div>
<div id="term"><div class="hd"><span><b>agent</b> · 0x3c44…93bc</span><span>wallet 0xd805…1f81</span></div><div id="lines"></div></div>
<div id="ripple"></div>
<svg id="cursor" viewBox="0 0 28 28"><path d="M4 2l17 10.5-7.6 1.5L10 22z" fill="#ece9e2" stroke="#0d0d0d" stroke-width="1.5" stroke-linejoin="round"/></svg>
<div id="cap"></div>
<div id="tag">Demo · local test network · mock token</div>
<div id="end"><div class="l">Charter · Robinhood Chain</div><h2>Limits your agent<br><em>can't break.</em></h2><p>Per payment · per day · allowlist · pause</p></div>
<div id="fade"></div>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search);
var C={rpc:q.get('rpc')||'http://127.0.0.1:8545',factory:q.get('factory')||'0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9',account:q.get('account')||'0xd8058efe0198ae9dD7D563e1b4938Dcbc86A1F81',
  token:q.get('token')||'0x5FbDB2315678afecb367f032d93F642f64180aa3',owner:(q.get('owner')||'0x70997970C51812dc3A010C7d01b50e0d17dc79C8').toLowerCase(),
  agent:q.get('agent')||'0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC',merchant:q.get('merchant')||'0x90F79bf6EB2c4f870365E785982E1f101E93b906',stranger:'0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65',agentId:q.get('agentId')||'8843'};
var DURATION=32;
function $(id){return document.getElementById(id)}
function cl(x){return x<0?0:x>1?1:x}
function seg(t,a,b){return cl((t-a)/(b-a))}
function eo(x){return 1-Math.pow(1-x,3)}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function w(x){return x.replace(/^0x/,'').toLowerCase().padStart(64,'0')}
function amt(n){return (BigInt(n)*10n**18n).toString(16).padStart(64,'0')}
function short(a){return a.slice(0,6)+'…'+a.slice(-4)}
function rpc(m,p){return fetch(C.rpc,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:m,params:p})}).then(function(r){return r.json()})}
var frame=$('app'),W=null,D=null,WIN={x:60,y:100+44};
frame.src='/app.html?factory='+C.factory+'&vrpc='+encodeURIComponent(C.rpc)+'#policies-'+C.agentId;

/* ---------- the agent's payments: real transactions from the agent key ---------- */
var WHY={OverPaymentLimit:'over the 50 MBOND per-payment limit',OverDailyLimit:'would pass the 120 MBOND daily limit',NotAllowed:'recipient is not on the allowlist',IsPaused:'the owner paused this agent'};
function line(cmd){var el=document.createElement('div');el.className='ln';el.innerHTML='<div class="cmd"><i>$</i> '+cmd+'</div><div class="res"><span class="wait">sending…</span></div>';$('lines').appendChild(el);
  requestAnimationFrame(function(){el.classList.add('on')});return el}
function pay(n,to,label){var el=line('agent pay <b>'+n+' MBOND</b> → '+label);
  return rpc('eth_sendTransaction',[{from:C.agent,to:C.account,data:'0xb3d76188'+w(C.token)+w(to)+amt(n)}]).then(function(j){var r=el.querySelector('.res');
    if(j.error){var m=/custom error '(\w+)\(/.exec(j.error.message||''),name=m?m[1]:'reverted';r.innerHTML='<span class="err">✗ rejected by the wallet: '+name+'</span><span class="why">'+(WHY[name]||'')+'</span>'}
    else{r.innerHTML='<span class="ok">✓ paid · tx '+j.result.slice(0,10)+'…</span>';refresh()}})}
function refresh(){var f=D&&D.getElementById('polForm');if(f)f.requestSubmit()}

/* ---------- cursor over the app ---------- */
function rect(sel){var e=D&&D.querySelector(sel);if(!e)return null;var r=e.getBoundingClientRect();return {x:WIN.x+r.left+r.width/2,y:WIN.y+r.top+r.height/2}}
function btn(text){var b=D&&[].slice.call(D.querySelectorAll('.polctl button')).find(function(x){return x.textContent===text});return b||null}
function target(p){if(typeof p!=='string')return p;if(p==='pause'){var b=btn('Pause agent')||btn('Unpause agent');if(!b)return {x:900,y:700};var r=b.getBoundingClientRect();return {x:WIN.x+r.left+r.width/2,y:WIN.y+r.top+r.height/2}}return rect(p)||{x:600,y:500}}
var PATH=[[0,{x:700,y:640}],[1.4,{x:700,y:640}],[2.6,'.ptable tbody tr:last-child'],[4.4,'.ptable tbody tr:last-child'],[5.2,{x:1180,y:560}],[19.6,{x:1180,y:560}],[21.2,'pause'],[23.4,'pause'],[24.4,{x:1180,y:600}]];
var CLICKS=[21.6];
function cursorAt(t){for(var i=0;i<PATH.length-1;i++){var a=PATH[i],b=PATH[i+1];if(t<=b[0]){var A=target(a[1]),B=target(b[1]),x=eio(seg(t,a[0],b[0]));return {x:A.x+(B.x-A.x)*x,y:A.y+(B.y-A.y)*x}}}return target(PATH[PATH.length-1][1])}

var DONE={};function once(k,t,at,fn){if(t>=at&&!DONE[k]){DONE[k]=1;fn()}}
var CAPS=[[1.2,4.9,'01','The owner sets the rules'],[5.2,19.4,'02','The agent pays within them'],[19.6,25.6,'03','One click stops it']];

window.step=function(t){
  $('fade').style.opacity=Math.max(1-seg(t,0,.6),seg(t,31.3,32));
  once('p1',t,5.6,function(){pay(30,C.merchant,'merchant')});
  once('p2',t,8.4,function(){pay(60,C.merchant,'merchant')});
  once('p3',t,11.2,function(){pay(50,C.merchant,'merchant')});
  once('p4',t,14,function(){pay(50,C.merchant,'merchant')});
  once('p5',t,16.8,function(){pay(30,C.stranger,short(C.stranger)+' <i>(not listed)</i>')});
  once('pause',t,21.6,function(){var b=btn('Pause agent');if(b)b.click()});
  once('p6',t,23.6,function(){pay(10,C.merchant,'merchant')});
  var c=cursorAt(t);$('cursor').style.transform='translate('+(c.x-5)+'px,'+(c.y-3)+'px)';$('cursor').style.opacity=t<1.2||t>25.4?0:1;
  var rp=$('ripple'),last=null;CLICKS.forEach(function(k){if(t>=k&&t<k+.5)last=k});
  if(last!=null){var qq=seg(t,last,last+.5);rp.style.left=c.x+'px';rp.style.top=c.y+'px';rp.style.opacity=1-qq;rp.style.transform='scale('+(.4+qq)+')'}else rp.style.opacity=0;
  var cap=$('cap'),o=0;CAPS.forEach(function(k){if(t>=k[0]&&t<=k[1]){o=Math.min(eo(seg(t,k[0],k[0]+.4)),1-seg(t,k[1]-.3,k[1]));if(cap.dataset.k!==k[2]){cap.dataset.k=k[2];cap.innerHTML='<b>'+k[2]+'</b>'+k[3]}}});cap.style.opacity=o;
  var e=eo(seg(t,25.8,26.8));$('end').style.opacity=e;$('end').querySelector('h2').style.transform='translateY('+(1-e)*24+'px)';
};
window.DURATION=DURATION;
window.ready=new Promise(function(res){frame.addEventListener('load',function(){W=frame.contentWindow;D=frame.contentDocument;
  // the owner's wallet inside the app: a stand-in that sends through the local node (owner is an unlocked test account)
  W.ethereum={request:function(a){if(a.method==='eth_requestAccounts'||a.method==='eth_accounts')return Promise.resolve([C.owner]);
    return rpc(a.method,a.params||[]).then(function(j){if(j.error)throw new Error(j.error.message);return j.result})}};
  var st=D.createElement('style');st.textContent='*{scroll-behavior:auto!important;transition:none!important}::-webkit-scrollbar{display:none}html{scrollbar-width:none}';D.head.appendChild(st);
  W.ethereum.request({method:'eth_requestAccounts'});D.getElementById('connectBtn').click();
  (function poll(n){var g=D.querySelector('.polctl');if(g||n>80){if(g){var top=D.querySelector('.polgrid').getBoundingClientRect().top+W.scrollY-D.querySelector('.top').offsetHeight-4;W.scrollTo(0,top)}
      (document.fonts?document.fonts.ready:Promise.resolve()).then(function(){window.step(0);res(true)});return}
    if(n===6)D.getElementById('polForm').requestSubmit();setTimeout(function(){poll(n+1)},250)})(0)})});
if(/[?&]play/.test(location.search))window.ready.then(function(){var t0=performance.now();(function loop(now){var t=(now-t0)/1000;if(t<=DURATION){window.step(t);requestAnimationFrame(loop)}})(t0)});
})();
</script>
</body>
</html>
