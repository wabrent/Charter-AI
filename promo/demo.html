<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Charter AI demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=block">
<style>
/* Staged screen recording of the real app (app.html in an iframe) with a scripted cursor and a test wallet.
   Nothing is sent to the network: the wallet below is a stand-in that answers the app's requests.
   window.step(t) moves the recording forward to time t; it only goes forward. */
:root{--red:#c81b1c;--ok:#3fae63;--sub:#d9d9d9;--lab:#8f8f8f;--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.26);
  --SG:'Space Grotesk',Arial,sans-serif;--JB:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;color:#fff;font-family:var(--JB);-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 55% 60% at 50% 40%,rgba(200,27,28,.20),transparent 70%),#000}
#grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;opacity:.25;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 45%,#000,transparent 80%)}
#win{position:absolute;left:192px;top:64px;width:1536px;height:868px;border:1px solid var(--line2);background:#000;overflow:hidden;
  box-shadow:0 40px 120px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.04);transform-origin:50% 50%}
#bar{height:46px;display:flex;align-items:center;gap:16px;padding:0 18px;background:#0b0b0b;border-bottom:1px solid var(--line)}
#bar .dots{display:flex;gap:8px}#bar .dots i{width:12px;height:12px;border-radius:50%;background:#2a2a2a}
#bar .addr{flex:1;max-width:620px;margin:0 auto;height:28px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#151515;border-radius:6px;font-size:14px;color:var(--sub)}
#bar .addr svg{width:12px;height:12px}
#frameWrap{position:absolute;left:0;top:46px;width:1280px;height:685px;transform:scale(1.2);transform-origin:0 0}
iframe{width:1280px;height:685px;border:0;background:#000;display:block}

/* test wallet */
#wallet{position:absolute;right:28px;top:58px;width:400px;background:#0d0d0d;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.85);opacity:0;transform:translateY(-12px)}
#wallet .wh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
#wallet .wh .ic{width:30px;height:30px;border:1.5px solid #fff;display:grid;place-items:center;font:700 15px/1 var(--SG)}
#wallet .wh b{font:500 18px/1 var(--SG)}
#wallet .wh .net{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);border:1px solid var(--line);padding:6px 10px}
#wallet .wh .net i{width:8px;height:8px;background:var(--ok)}
#wallet .wb{padding:20px}
#wallet .site{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--sub)}
#wallet .site span{width:34px;height:34px;border:1px solid var(--line2);display:grid;place-items:center;font:700 16px/1 var(--SG)}
#wallet h3{margin-top:18px;font:500 24px/1.2 var(--SG)}
#wallet .kv{margin-top:16px;border:1px solid var(--line)}
#wallet .kv div{display:flex;justify-content:space-between;gap:16px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
#wallet .kv div:last-child{border-bottom:0}
#wallet .kv span{color:var(--lab)}
#wallet .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
#wallet .acts div{height:48px;display:grid;place-items:center;font:500 16px/1 var(--SG);border:1px solid var(--line2)}
#wallet .acts .go{background:var(--red);border-color:var(--red)}
#wallet .note{margin-top:14px;font-size:12px;color:var(--lab)}

#cursor{position:absolute;left:0;top:0;width:30px;height:30px;opacity:0;pointer-events:none;z-index:20}
#ripple{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:2px solid var(--red);border-radius:50%;opacity:0;z-index:19}
#cap{position:absolute;left:0;right:0;bottom:44px;text-align:center;font:500 34px/1 var(--SG);letter-spacing:-.01em;opacity:0}
#cap b{color:var(--red);font-weight:500;margin-right:14px}
#tag{position:absolute;right:40px;bottom:46px;font-size:15px;color:var(--lab);letter-spacing:.14em}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;opacity:0;z-index:30}
#end svg{width:96px;height:96px}
#end h2{margin-top:44px;font:700 84px/1.05 var(--SG);letter-spacing:-.035em;text-align:center}
#end p{margin-top:30px;font-size:26px;color:var(--sub)}
#fade{position:absolute;inset:0;background:#000;z-index:40}
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div>
<div id="win">
  <div id="bar"><div class="dots"><i></i><i></i><i></i></div>
    <div class="addr"><svg viewBox="0 0 12 12" fill="none" stroke="#8f8f8f" stroke-width="1.4"><rect x="2" y="5" width="8" height="6"/><path d="M4 5V3.5a2 2 0 014 0V5"/></svg><span id="addr">Charter AI · /app.html#registry</span></div></div>
  <div id="frameWrap"><iframe id="app" src="/app.html#registry"></iframe></div>
  <div id="wallet"><div class="wh"><div class="ic">W</div><b>Test wallet</b><div class="net"><i></i>Robinhood Chain</div></div><div class="wb" id="wbody"></div></div>
</div>
<div id="ripple"></div>
<svg id="cursor" viewBox="0 0 30 30"><path d="M5 3l18 11-8 1.6L11 24z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>
<div id="cap"></div>
<div id="tag">DEMO · TEST WALLET · NOTHING SENT</div>
<div id="end">
  <svg viewBox="0 0 46 46" fill="none" stroke="#fff" stroke-width="3">
    <g><path d="M23 0V19.5"/><path d="M14 10.2L23 19.2L32 10.2"/></g><g transform="rotate(90 23 23)"><path d="M23 0V19.5"/><path d="M14 10.2L23 19.2L32 10.2"/></g>
    <g transform="rotate(180 23 23)"><path d="M23 0V19.5"/><path d="M14 10.2L23 19.2L32 10.2"/></g><g transform="rotate(270 23 23)"><path d="M23 0V19.5"/><path d="M14 10.2L23 19.2L32 10.2"/></g></svg>
  <h2>Your agent, on chain,<br>in under a minute</h2>
  <p>ERC-8004 · Robinhood Chain · no code</p>
</div>
<div id="fade"></div>

<script>
(function(){
'use strict';
var DURATION=27;
function $(id){return document.getElementById(id)}
function cl(x){return x<0?0:x>1?1:x}
function seg(t,a,b){return cl((t-a)/(b-a))}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function eo(x){return 1-Math.pow(1-x,3)}
var frame=$('app'),W=null,D=null,SCALE=1.2,WIN={x:192,y:64+46};
var ADDR='0x1f9a6c0e0b3d5f7a9c1e2d4b6a8c0e2f4a6c3c21';

/* ---------- test wallet: answers the app, resolves when the timeline clicks ---------- */
var pending={},state={connected:false,signed:false,mined:false},tx=null,agentId=null;
function wait(name){return new Promise(function(r){pending[name]=r})}
var provider={request:function(a){switch(a.method){
  case 'eth_accounts':return Promise.resolve(state.connected?[ADDR]:[]);
  case 'eth_requestAccounts':return state.connected?Promise.resolve([ADDR]):wait('connect').then(function(){return [ADDR]});
  case 'eth_chainId':return Promise.resolve('0x1237');
  case 'eth_getBalance':return Promise.resolve('0x2c68af0bb140000');           // 0.2 ETH
  case 'eth_estimateGas':return Promise.resolve('0x5b8d8');
  case 'eth_gasPrice':return Promise.resolve('0x989680');
  case 'eth_sendTransaction':tx=a.params[0];agentId=readId(tx.data);return wait('sign').then(function(){return '0x'+'7c'.repeat(32)});
  case 'eth_getTransactionReceipt':return Promise.resolve(state.mined?{status:'0x1',logs:[{address:'0x8004A169FB4a3325136EB29fA0ceB6D2e539a432',
    topics:['0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef','0x'+'0'.repeat(64),'0x'+'0'.repeat(24)+ADDR.slice(2),'0x'+(agentId||0).toString(16).padStart(64,'0')]}]}:null);
  default:return Promise.reject(new Error('unsupported '+a.method))}}};
function readId(data){try{var hex=data.slice(10),len=parseInt(hex.slice(64,128),16),s=hex.slice(128,128+len*2),str='';for(var i=0;i<s.length;i+=2)str+=String.fromCharCode(parseInt(s.substr(i,2),16));
  var j=JSON.parse(decodeURIComponent(escape(atob(str.split(',')[1]))));return j.registrations&&j.registrations[0]?j.registrations[0].agentId:null}catch(e){return null}}

/* ---------- helpers on the app document ---------- */
function rect(sel){var e=typeof sel==='string'?D.querySelector(sel):sel;if(!e)return null;var r=e.getBoundingClientRect();return {x:WIN.x+(r.left+r.width/2)*SCALE,y:WIN.y+(r.top+r.height/2)*SCALE}}
function type(sel,text,t,a,b){var e=D.querySelector(sel);if(!e)return;var n=Math.round(text.length*seg(t,a,b));var v=text.slice(0,n);if(e.value!==v){e.value=v;e.dispatchEvent(new W.Event('input',{bubbles:true}))}}
function focus(sel){var e=D.querySelector(sel);if(e&&D.activeElement!==e)e.focus({preventScroll:true})}

/* cursor path: [time, target] — target is a selector in the app or a wallet button */
var PATH=[[0,{x:960,y:600}],[1.4,{x:960,y:600}],[2.4,'a.tab[data-tab="register"]'],[3.2,'a.tab[data-tab="register"]'],[3.8,'#fName'],[5.4,'#fName'],[6.0,'#fDesc'],[9.0,'#fDesc'],[9.6,'#svcs .svc input'],[11.4,'#svcs .svc input'],
  [12.6,'#submitBtn'],[13.4,'#submitBtn'],[14.4,'wallet-go'],[15.3,'wallet-go'],[16.3,{x:1500,y:520}],[17.3,'wallet-go'],[18.6,'wallet-go'],[19.6,{x:1100,y:760}]];
var CLICKS=[2.5,3.9,6.1,9.7,13.0,14.6,17.6];
function target(p){if(typeof p!=='string')return p;if(p==='wallet-go'){var g=$('wbody').querySelector('.go');if(!g)return {x:1560,y:600};var r=g.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2}}return rect(p)||{x:960,y:540}}
function cursorAt(t){for(var i=0;i<PATH.length-1;i++){var a=PATH[i],b=PATH[i+1];if(t<=b[0]){var A=target(a[1]),B=target(b[1]),x=eio(seg(t,a[0],b[0]));return {x:A.x+(B.x-A.x)*x,y:A.y+(B.y-A.y)*x}}}return target(PATH[PATH.length-1][1])}

/* wallet screens */
function walletConnect(){$('wbody').innerHTML='<div class="site"><span>C</span>Charter AI wants to connect</div><h3>Connect this wallet?</h3><div class="kv"><div><span>Account</span>'+ADDR.slice(0,6)+'…'+ADDR.slice(-4)+'</div><div><span>Network</span>Robinhood Chain · 4663</div></div><div class="acts"><div>Cancel</div><div class="go">Connect</div></div><div class="note">The site can see your address. It cannot move funds.</div>'}
function walletSign(){$('wbody').innerHTML='<div class="site"><span>C</span>Charter AI</div><h3>Confirm transaction</h3><div class="kv"><div><span>To</span>0x8004…a432</div><div><span>Contract</span>ERC-8004 Identity Registry</div><div><span>Function</span>register(string)</div><div><span>Value</span>0 ETH</div><div><span>Network fee</span>≈ 0.000004 ETH</div></div><div class="acts"><div>Reject</div><div class="go">Confirm</div></div><div class="note">One transaction. No token approvals.</div>'}
function showWallet(o){var w=$('wallet');w.style.opacity=o;w.style.transform='translateY('+((1-o)*-12)+'px)'}

var DONE={},SCROLL=null;
function once(k,t,at,fn){if(t>=at&&!DONE[k]){DONE[k]=1;fn()}}
var CAPS=[[2.4,11.9,'1','Describe your agent'],[12.4,15.4,'2','Connect your wallet'],[15.6,19.4,'3','Sign one transaction'],[19.8,23.6,'✓','Live on Robinhood Chain']];

window.step=function(t){
  // window, fades
  var wi=eo(seg(t,0,.9));$('win').style.transform='scale('+(.96+.04*wi)+')';$('fade').style.opacity=Math.max(1-seg(t,0,.6),seg(t,26.4,27));
  // actions in the app
  once('reg',t,2.5,function(){W.location.hash='#register';$('addr').textContent='Charter AI · /app.html#register'});
  if(t>=3.9&&t<5.6)focus('#fName');type('#fName','Atlas Research',t,4.0,5.3);
  if(t>=6.1&&t<9.2)focus('#fDesc');type('#fDesc','Reads filings and earnings calls for tokenized stocks and returns a cited one-page brief.',t,6.2,8.9);
  once('mcp',t,9.7,function(){var s=D.querySelector('#svcs .svc select');s.value='MCP';s.dispatchEvent(new W.Event('change',{bubbles:true}))});
  if(t>=9.7&&t<11.6)focus('#svcs .svc input');type('#svcs .svc input','https://atlas.example/mcp',t,9.8,11.3);
  // scroll the form so the transaction note and the button are in view
  var sc=eio(seg(t,11.5,12.4));if(SCROLL==null&&t>=11.5){var b=D.getElementById('submitBtn');SCROLL=Math.max(0,b.getBoundingClientRect().top+W.scrollY-430)}
  if(SCROLL!=null&&t<19.6)W.scrollTo(0,SCROLL*sc);
  once('submit',t,13.0,function(){D.activeElement&&D.activeElement.blur();D.getElementById('form').requestSubmit()});
  once('wc',t,13.3,walletConnect);
  once('conn',t,14.6,function(){state.connected=true;pending.connect&&pending.connect()});
  once('ws',t,15.5,walletSign);
  once('sign',t,17.6,function(){state.signed=true;pending.sign&&pending.sign()});
  once('mine',t,18.9,function(){state.mined=true});
  once('top',t,19.6,function(){W.scrollTo(0,0)});
  showWallet(t<13.3?0:t<14.7?eo(seg(t,13.3,13.6)):t<15.4?1-eo(seg(t,14.7,15)):t<17.7?eo(seg(t,15.4,15.7)):1-eo(seg(t,17.7,18)));
  // cursor and clicks
  var c=cursorAt(t);$('cursor').style.transform='translate('+(c.x-6)+'px,'+(c.y-4)+'px)';$('cursor').style.opacity=t<1.2||t>23.8?0:1;
  var rp=$('ripple'),last=null;CLICKS.forEach(function(k){if(t>=k&&t<k+.5)last=k});
  if(last!=null){var q=seg(t,last,last+.5);rp.style.left=c.x+'px';rp.style.top=c.y+'px';rp.style.opacity=1-q;rp.style.transform='scale('+(.4+q)+')'}else rp.style.opacity=0;
  // captions
  var cap=$('cap'),o=0;CAPS.forEach(function(k){if(t>=k[0]&&t<=k[1]){o=Math.min(eo(seg(t,k[0],k[0]+.4)),1-seg(t,k[1]-.3,k[1]));if(cap.dataset.k!==k[2]){cap.dataset.k=k[2];cap.innerHTML='<b>'+k[2]+'</b>'+k[3]}}});cap.style.opacity=o;
  // end card
  var e=eo(seg(t,23.8,24.6));$('end').style.opacity=e;$('end').querySelector('h2').style.transform='translateY('+(1-e)*24+'px)';
};
window.DURATION=DURATION;
window.ready=new Promise(function(res){frame.addEventListener('load',function(){W=frame.contentWindow;D=frame.contentDocument;W.ethereum=provider;
  var st=D.createElement('style');st.textContent='*{scroll-behavior:auto!important}::-webkit-scrollbar{display:none}html{scrollbar-width:none}';D.head.appendChild(st);
  // wait for live registry rows so the first frames show real data
  // and load older pages until a few readable profiles are on screen
  (function poll(n){var rows=D.querySelectorAll('#ledger a.row').length,more=D.getElementById('moreBtn');
    if(rows>=6||n>160)return (document.fonts?document.fonts.ready:Promise.resolve()).then(function(){W.scrollTo(0,0);window.step(0);res(true)});
    if(more&&!more.hidden&&!more.disabled&&n%8===0)more.click();
    setTimeout(function(){poll(n+1)},250)})(0)})});
if(/[?&]play/.test(location.search))window.ready.then(function(){var t0=performance.now();(function loop(now){var t=(now-t0)/1000;if(t<=DURATION){window.step(t);requestAnimationFrame(loop)}})(t0)});
})();
</script>
</body>
</html>
