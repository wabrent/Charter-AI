<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$LIMIT logos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=block">
<style>
/* Default: a 1560x700 sheet of three options. ?only=a|b|c renders that one at 1024x1024. Same Bayer dither as the X avatar. */
:root{--bg:#0d0d0d;--ink:#ece9e2;--sub:#b9b5ad;--lab:#7f7b74;--SERIF:'Instrument Serif',serif;--MONO:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
.sheet{width:1560px;height:700px;padding:64px 60px;display:flex;gap:60px}
.opt{width:440px}
.opt canvas{width:440px;height:440px;display:block;border-radius:50%;box-shadow:0 0 0 1px rgba(236,233,226,.14)}
.opt .k{margin-top:30px;font:400 14px/1 var(--MONO);letter-spacing:.16em;text-transform:uppercase;color:var(--lab)}
.opt .n{margin-top:12px;font:400 40px/1 var(--SERIF)}
.opt .d{margin-top:10px;font:400 15px/1.45 var(--MONO);color:var(--sub)}
.solo canvas{width:1024px;height:1024px;display:block}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  var B=[0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map(function(v){return (v+.5)/64});
  function n2(x,y,t){return Math.sin(x*1.7+t*.6)*Math.cos(y*1.3-t*.4)+.5*Math.sin(x*3.1-y*2.3+t*.9)}
  var INK='rgba(236,233,226,.94)',t=7.3,CAP=-.18; // CAP: the limit line, in -1..1 coords (up is negative)

  // Paints a dithered field: val(x,y) in -1..1 coords returns 0..1 brightness.
  function dither(cv,size,cells,val){
    var cx=cv.getContext('2d');cv.width=size;cv.height=size;cx.fillStyle='#0d0d0d';cx.fillRect(0,0,size,size);
    var cell=size/cells,sz=cell*.74,off=(cell-sz)/2;cx.fillStyle=INK;
    for(var j=0;j<cells;j++)for(var i=0;i<cells;i++){var x=(i+.5)/cells*2-1,y=(j+.5)/cells*2-1,v=val(x,y);
      if(v>B[(j&7)*8+(i&7)])cx.fillRect(i*cell+off,j*cell+off,sz,sz)}
    return {cx:cx,cell:cell};
  }
  function capLine(cx,size,y,x0,x1,w){cx.fillStyle=INK;var py=(y+1)/2*size;cx.fillRect((x0+1)/2*size,py-w/2,(x1-x0)/2*size,w)}

  var lx=-.42,ly=-.62,lz=.66,ll=Math.hypot(lx,ly,lz);lx/=ll;ly/=ll;lz/=ll;
  function sphere(x,y,r){var d=Math.hypot(x,y)/r;if(d>=1)return 0;var z=Math.sqrt(1-d*d),lam=Math.max(0,(x/r)*lx+(y/r)*ly+z*lz),tex=.5+.5*n2(x*3+t*.2,y*3,t);return (Math.pow(lam,1.3)*.95+tex*.12)*(.35+.65*Math.pow(z,.6))}

  var OPTS={
    a:{name:'Capped sphere',desc:'The Charter sphere, cut flat by the limit line. Same family as the avatar.',
      draw:function(cv,size){var cells=Math.round(size/5.5),r=.5,ca=Math.cos(-.38),sa=Math.sin(-.38);
        var o=dither(cv,size,cells,function(x,y){var v=y<CAP?0:sphere(x,y-.06,r);
          var rx=(x*ca-y*sa),ry=(x*sa+y*ca)/.38,rd=Math.abs(Math.hypot(rx,ry)-.9);
          if(rd<.07&&(ry>0||Math.hypot(x,y-.06)>r)&&y>CAP-.3)v=Math.max(v,(1-rd/.07)*.85);return v});
        capLine(o.cx,size,CAP,-.62,.62,size*.012)}},
    b:{name:'Serif L',desc:'A dithered L with the limit line above it. Reads as the ticker at any size.',
      draw:function(cv,size){var m=document.createElement('canvas');m.width=m.height=size;var mx=m.getContext('2d');
        mx.fillStyle='#fff';mx.font='400 '+Math.round(size*.78)+'px "Instrument Serif"';mx.textAlign='center';mx.textBaseline='alphabetic';mx.fillText('L',size*.5,size*.83);
        var md=mx.getImageData(0,0,size,size).data,cells=Math.round(size/5.5);
        var o=dither(cv,size,cells,function(x,y){var px=Math.min(size-1,Math.floor((x+1)/2*size)),py=Math.min(size-1,Math.floor((y+1)/2*size));
          if(md[(py*size+px)*4+3]<128)return 0;return .38+.6*Math.max(0,1-(y+.4)*.55-x*.25)});
        capLine(o.cx,size,-.56,-.42,.42,size*.012)}},
    c:{name:'Gauge',desc:'A wallet filled to its daily limit. Plain about what the product does.',
      draw:function(cv,size){var cells=Math.round(size/5.5),r=.7,lvl=.02;
        var o=dither(cv,size,cells,function(x,y){var d=Math.hypot(x,y);
          if(Math.abs(d-r)<.022)return .95;
          if(d<r-.08&&y>lvl){return .25+.7*Math.min(1,(y-lvl)/.6)+.08*n2(x*4,y*4,t)}return 0});
        capLine(o.cx,size,lvl-.03,-.84,.84,size*.012)}}
  };

  var only=(/[?&]only=([abc])/.exec(location.search)||[])[1],root=document.getElementById('root');
  window.ready=document.fonts.load('400 100px "Instrument Serif"').then(function(){
    if(only){root.className='solo';var cv=document.createElement('canvas');root.appendChild(cv);OPTS[only].draw(cv,1024);return true}
    root.className='sheet';
    Object.keys(OPTS).forEach(function(k){var o=OPTS[k],box=document.createElement('div');box.className='opt';
      var cv=document.createElement('canvas');box.appendChild(cv);o.draw(cv,880);
      box.insertAdjacentHTML('beforeend','<div class="k">Option '+k.toUpperCase()+' · $LIMIT</div><div class="n">'+o.name+'</div><div class="d">'+o.desc+'</div>');root.appendChild(box)});
    return true;
  });
})();
</script>
</body>
</html>
