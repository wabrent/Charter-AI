<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X avatar and banner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=block">
<style>
/* ?avatar renders the 400x400 avatar, otherwise the 1500x500 banner. Same dither as index.html, frozen at one time. */
:root{--bg:#0d0d0d;--ink:#ece9e2;--sub:#b9b5ad;--lab:#7f7b74;--line:rgba(236,233,226,.14);
  --SERIF:'Instrument Serif',serif;--MONO:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
.stage{position:relative;overflow:hidden;background:var(--bg)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* banner */
.banner{width:1500px;height:500px}
.banner .txt{position:absolute;left:96px;top:92px}
.banner .lab{font:400 15px/1 var(--MONO);letter-spacing:.16em;text-transform:uppercase;color:var(--sub)}
.banner h1{margin-top:22px;font:400 104px/.92 var(--SERIF);letter-spacing:-.02em}
.banner h1 em{font-style:italic}
.banner .url{position:absolute;right:72px;bottom:40px;font:400 15px/1 var(--MONO);letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
.banner .rule{position:absolute;left:96px;right:72px;bottom:84px;height:1px;background:var(--line)}
.banner .meta{position:absolute;left:420px;bottom:40px;font:400 15px/1 var(--MONO);letter-spacing:.14em;text-transform:uppercase;color:var(--lab)}
/* avatar */
.avatar{width:400px;height:400px}
.avatar .word{position:absolute;left:0;right:0;bottom:62px;text-align:center;font:400 46px/1 var(--SERIF);letter-spacing:.3em;text-indent:.3em;text-transform:uppercase}
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="dither"></canvas>
</div>
<script>
(function(){
  var isAvatar=/[?&]avatar/.test(location.search),st=document.getElementById('stage');
  if(isAvatar){st.className='stage avatar'}
  else{st.className='stage banner';st.insertAdjacentHTML('beforeend','<div class="txt"><div class="lab">Agent identity on Robinhood Chain</div><h1>Identity,<br>for every <em>agent.</em></h1></div><div class="rule"></div><div class="meta">ERC-8004 · one transaction · no code</div><div class="url">charterai.world</div>')}
  var cv=document.getElementById('dither'),cx=cv.getContext('2d'),dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cx.setTransform(dpr,0,0,dpr,0,0);
  var cell=isAvatar?5:5,cols=Math.ceil(W/cell),rows=Math.ceil(H/cell);
  var B=[0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map(function(v){return (v+.5)/64});
  function n2(x,y,t){return Math.sin(x*1.7+t*.6)*Math.cos(y*1.3-t*.4)+.5*Math.sin(x*3.1-y*2.3+t*.9)}
  var t=7.3;
  // sphere centre and radius in pixels
  var scx=isAvatar?W*.5:W*.79, scy=isAvatar?H*.5:H*.47, R=isAvatar?W*.24:H*.28;
  var lx=Math.cos(t*.25)*.6-.3,ly=-.55,lz=.6,ll=Math.hypot(lx,ly,lz);lx/=ll;ly/=ll;lz/=ll;
  var tilt=.38,rot=isAvatar?-.38:-.32,ca=Math.cos(rot),sa=Math.sin(rot);
  cx.fillStyle='rgba(236,233,226,.92)';var sz=cell*.74,off=(cell-sz)/2;
  for(var j=0;j<rows;j++){for(var i=0;i<cols;i++){
    var px=i*cell+cell/2,py=j*cell+cell/2,x=(px-scx)/R,y=(py-scy)/R,d=Math.hypot(x,y),val=0;
    if(d<1){var z=Math.sqrt(1-d*d),lam=Math.max(0,x*lx+y*ly+z*lz),tex=.5+.5*n2(x*3+t*.2,y*3,t);val=(Math.pow(lam,1.3)*.95+tex*.12)*(.35+.65*Math.pow(z,.6))}
    var rx=(x*ca-y*sa),ry=(x*sa+y*ca)/tilt,rd=Math.abs(Math.hypot(rx,ry)-1.55);
    if(rd<.06&&(ry>0||d>1))val=Math.max(val,(1-rd/.06)*.85);
    if(!isAvatar&&py<H*.76&&px>W*.47){var u=px/W,v=py/H,m=n2(u*6-t*.15,v*3+t*.1,t*.5),fall=Math.max(0,1-Math.hypot((u-.62)*1.5,(v-.72)*1.6)*1.8);val=Math.max(val,(m*.5+.5)*fall*.36)}
    if(val>B[(j&7)*8+(i&7)])cx.fillRect(i*cell+off,j*cell+off,sz,sz)}}
  window.ready=document.fonts.ready.then(function(){return true});
})();
</script>
</body>
</html>
